# Changing these bridges makes `netplan apply` restart NetworkManager,
# which rebuilds br-clients and br-trunk and unplugs any VM attached to
# them. Stop OPNsense first, or run scripts/tapcheck afterwards and restart it.

- hosts: host
  become: true
  tasks:
    # The networkmanager: block in the template is only valid when NetworkManager renders
    # netplan (desktops, mera-server). Ubuntu Server and cloud images use systemd-networkd,
    # which rejects it; there, dhcp4/link-local/accept-ra already keep the bridges address-free.
    - name: Check which services run (is NetworkManager rendering netplan?)
      ansible.builtin.service_facts:

    - name: Remember whether NetworkManager is in charge
      ansible.builtin.set_fact:
        netplan_nm: "{{ ansible_facts.services['NetworkManager.service'] is defined and ansible_facts.services['NetworkManager.service'].state == 'running' }}"

    - name: Install lab bridges netplan config
      ansible.builtin.template:
        src: 99-lab-bridges.yaml.j2
        dest: /etc/netplan/99-lab-bridges.yaml
        owner: root
        group: root
        mode: "0600"
      notify: apply netplan

    - name: Remove old single-bridge config
      ansible.builtin.file:
        path: /etc/netplan/99-br-clients.yaml
        state: absent
      notify: apply netplan

  handlers:
    - name: apply netplan
      ansible.builtin.command: netplan apply
